<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passports &amp; Visas</title>
  <!-- trek:ui -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page trek-page-enter">
    <header class="heading">
      <div><p class="eyebrow" data-i18n="page.eyebrow">PERSONAL TRAVEL DOCUMENTS</p><h1 data-i18n="page.title">Passports &amp; Visas</h1><p class="trek-muted" data-i18n="page.subtitle">Keep every passport. Connect every journey.</p></div>
    </header>
    <section id="overview" class="overview" aria-label="Travel document overview" data-i18n-aria="page.overview"></section>
    <section class="trek-glass content">
      <div class="toolbar">
        <div id="tabs" class="tabs" role="tablist" aria-label="Record types" data-i18n-aria="page.recordTypes">
          <button class="tab" id="tab-passports" role="tab" aria-controls="records" data-kind="passports" aria-selected="true" data-i18n="types.passports">Passports</button>
          <button class="tab" id="tab-visas" role="tab" aria-controls="records" data-kind="visas" aria-selected="false" tabindex="-1" data-i18n="types.visas">Visas</button>
          <button class="tab" id="tab-applications" role="tab" aria-controls="records" data-kind="applications" aria-selected="false" tabindex="-1" data-i18n="types.applications">Applications</button>
          <button class="tab" id="tab-stays" role="tab" aria-controls="records" data-kind="stays" aria-selected="false" tabindex="-1" data-i18n="types.stays">Border crossings</button>
          <button class="tab" id="tab-permits" role="tab" aria-controls="records" data-kind="permits" aria-selected="false" tabindex="-1" data-i18n="types.permits" hidden>HK &amp; Macao permits</button>
          <button class="tab" id="tab-permitStays" role="tab" aria-controls="records" data-kind="permitStays" aria-selected="false" tabindex="-1" data-i18n="types.permitStays" hidden>HK &amp; Macao crossings</button>
        </div>
        <div class="trek-cluster actions"><label class="reveal trek-muted"><input type="checkbox" id="reveal"> <span data-i18n="page.reveal">Show ID Number</span></label><button id="add" class="trek-btn trek-btn--primary" disabled data-i18n="actions.add">Add</button></div>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="retry" class="trek-btn trek-btn--secondary" type="button" data-i18n="page.retry" hidden>Retry</button>
      <p id="notice" class="trek-muted" role="status" data-i18n="page.connecting">Connecting to TREK…</p>
      <div id="records" role="tabpanel" aria-labelledby="tab-passports" aria-busy="true"></div>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="record-form">
      <header class="dialog-heading"><div><p class="eyebrow" data-i18n="editor.eyebrow">TRAVEL DOCUMENTS</p><h2 id="editor-title"></h2></div><button id="close" type="button" class="trek-btn trek-btn--ghost" aria-label="Close editor" data-i18n="editor.close" data-i18n-aria="editor.closeLabel">Close</button></header>
      <div id="fields" class="fields"></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <footer class="dialog-actions"><button id="cancel" type="button" class="trek-btn trek-btn--secondary" data-i18n="editor.cancel">Cancel</button><button id="save" type="submit" class="trek-btn trek-btn--primary">Save record</button></footer>
    </form>
  </dialog>
  <script src="./ui.js"></script>
  <script src="./app.js"></script>
</body>
</html>
